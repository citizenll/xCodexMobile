<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">xCodex Mobile Connector</title>
  <desc id="desc">A dark banner with cyan connector bars and xCodex Mobile Connector text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152f"/>
      <stop offset="0.48" stop-color="#141824"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="0" fill="url(#bg)"/>
  <g opacity="0.22">
    <circle cx="184" cy="118" r="180" fill="#0ea5e9"/>
    <circle cx="1280" cy="472" r="220" fill="#64748b"/>
  </g>
  <g transform="translate(238 152)" filter="url(#softShadow)">
    <rect x="0" y="108" width="54" height="190" rx="14" fill="#22d3ee"/>
    <rect x="64" y="84" width="54" height="202" rx="14" fill="url(#bar)"/>
    <rect x="128" y="62" width="54" height="202" rx="14" fill="url(#bar)" opacity="0.95"/>
    <rect x="192" y="42" width="54" height="196" rx="14" fill="url(#bar)" opacity="0.82"/>
    <rect x="256" y="24" width="54" height="176" rx="14" fill="url(#bar)" opacity="0.68"/>
    <rect x="320" y="8" width="54" height="148" rx="14" fill="url(#bar)" opacity="0.52"/>
  </g>
  <g transform="translate(650 184)">
    <text x="0" y="0" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="760" letter-spacing="0">xCodex</text>
    <text x="3" y="80" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="520" letter-spacing="0">Mobile Connector</text>
    <rect x="4" y="112" width="560" height="5" rx="2.5" fill="#e2e8f0" opacity="0.92"/>
    <text x="4" y="168" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="460" letter-spacing="0">Public AGPL source for the xCodex mobile bridge</text>
  </g>
</svg>
